name: houji XNU kernel

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: Xcode version on the macos-26 runner
        required: true
        default: "26.6"

permissions:
  contents: read

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      DEVICE_DIR: ${{ github.workspace }}/device
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          persist-credentials: false

      - name: Check out houji device repository
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Validate runner
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find mig
          for tool in git make clang cmake ninja unifdef; do command -v "$tool"; done

      - name: Configure and fetch sources
        working-directory: unixnu
        run: |
          ./unixnu defconfig houji_defconfig -D "$DEVICE_DIR"
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 -D "$DEVICE_DIR"

      - name: Apply XNU compatibility patch
        working-directory: unixnu
        run: |
          ./unixnu tree -D "$DEVICE_DIR"
          git -C out/houji/tree/refer/xnu apply "$DEVICE_DIR/patches/xnu-iorpc-message-from-mach.patch"

      - name: Annotate prelink binding diagnostics
        working-directory: unixnu
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = list(Path("kits").glob("*/native_prelink.py"))
          if not candidates:
              candidates = list(Path("out/houji/tree/kits").glob("*/native_prelink.py"))
          if len(candidates) != 1:
              raise SystemExit(f"expected one native_prelink.py, found: {candidates}")
          path = candidates[0]
          text = path.read_text()

          # The iOS 16 IOStorageFamily component imports this DriverKit-era
          # helper. The native BCM2837 build retains the corresponding local
          # IORPCMessageFromMachReply implementation, so expose local symbols
          # to the resolver and use that implementation as a compatibility
          # target when the C stub is dead-stripped.
          replacements = [
              ("def exports(data, image):", "def exports(data, image, include_local=False):"),
              ("        if kind & 0xe0 or not kind & 1 or not kind & 0x0e:",
               "        if kind & 0xe0 or not kind & 0x0e or (not include_local and not kind & 1):"),
              ("    for address, names in exports(native_data, native).items():",
               "    for address, names in exports(native_data, native, include_local=True).items:"),
          ]
          # Correct the final replacement's call syntax separately to keep the
          # marker unambiguous across UniXNU revisions.
          replacements[-1] = (replacements[-1][0],
              "    for address, names in exports(native_data, native, include_local=True).items():")
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"prelink marker not found: {old}")
              text = text.replace(old, new, 1)

          anchor = "    packed = metadata['_PrelinkLinkKASLROffsets']"
          alias = (
              "    if '_IORPCMessageFromMach' not in native_symbols:\n"
              "        reply = {address for address, names in exports(native_data, native, include_local=True).items()\n"
              "                 if any('IORPCMessageFromMachReply' in name for name in names)}\n"
              "        if len(reply) == 1:\n"
              "            native_symbols['_IORPCMessageFromMach'] = reply\n"
              "            print('native prelink compatibility alias: _IORPCMessageFromMach -> IORPCMessageFromMachReply')\n"
          )
          if anchor not in text:
              raise SystemExit("prelink symbol anchor not found")
          text = text.replace(anchor, alias + anchor, 1)

          old = "            replacement = unique_kernel_binding(target, original_symbols, native_symbols)"
          new = (
              "            try:\n"
              "                replacement = unique_kernel_binding(target, original_symbols, native_symbols)\n"
              "            except ValueError as error:\n"
              "                queue = [(root, [root]) for root in roots]\n"
              "                seen = set()\n"
              "                paths = []\n"
              "                while queue:\n"
              "                    identifier, chain = queue.pop(0)\n"
              "                    if identifier in seen:\n"
              "                        continue\n"
              "                    seen.add(identifier)\n"
              "                    if identifier == source[2]:\n"
              "                        paths.append(' -> '.join(chain))\n"
              "                        continue\n"
              "                    entry = entries.get(identifier)\n"
              "                    if entry:\n"
              "                        queue.extend((dep, chain + [dep]) for dep in (entry.get('OSBundleLibraries') or {}))\n"
              "                raise ValueError(f\"{error}; source={source[2]}; site={site:#x}; roots={paths}\") from error"
          )
          if old not in text:
              raise SystemExit("prelink binding line not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          print(f"annotated {path}")
          PY
      - name: Build houji kernel
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p out/houji/logs
          set +e
          ./unixnu build kernel -D "$DEVICE_DIR" -j 3 2>&1 | tee out/houji/logs/github-build.log
          build_status=${PIPESTATUS[0]}
          echo "UniXNU kernel build exit status: ${build_status}" | tee -a out/houji/logs/github-build.log
          exit "$build_status"

      - name: Collect kernel build diagnostics
        if: always()
        working-directory: unixnu
        run: |
          mkdir -p out/houji/logs
          {
            echo "=== runner ==="
            date -u
            xcodebuild -version || true
            xcrun --sdk iphoneos --show-sdk-version || true
            echo "=== source revisions ==="
            git rev-parse HEAD || true
            git -C "$DEVICE_DIR" rev-parse HEAD || true
            echo "=== output files ==="
            find out/houji -maxdepth 5 -type f -print 2>/dev/null | sort || true
            echo "=== IORPC native symbol diagnostics ==="
            native="out/houji/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
            if [ -f "$native" ]; then
              nm -an "$native" 2>/dev/null | grep -E 'IORPCMessageFromMach|IOUserServer' | tail -40 || true
              grep -R -n 'IOUserServer.cpp' out/houji/tree/build/xnu 2>/dev/null | tail -20 || true
            fi
            echo "=== log tails ==="
            for log in out/houji/logs/*.log; do
              [ -f "$log" ] || continue
              echo "--- ${log} (last 250 lines) ---"
              tail -n 250 "$log" || true
            done
          } | tee out/houji/logs/github-diagnostics.log

      - name: Hash kernel artifact
        if: success()
        working-directory: unixnu
        run: shasum -a 256 out/houji/kernel/kernel.macho > out/houji/kernel/kernel.macho.sha256

      - name: Upload kernel and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: houji-xnu-kernel-${{ github.run_number }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            unixnu/out/houji/**
            unixnu/out/houji/kernel/kernel.macho
            unixnu/out/houji/kernel/kernel.json
            unixnu/out/houji/kernel/kernel.macho.sha256
            unixnu/out/houji/logs/**/*.log
            unixnu/out/houji/.config
            device/unixnu.lock
