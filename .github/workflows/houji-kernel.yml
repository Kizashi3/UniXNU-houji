name: houji XNU kernel

on:
  push:
    branches:
      - kernel-cs-bypass
      - merged-root-kernel
  workflow_dispatch:
    inputs:
      xcode:
        description: Xcode version on the macos-26 runner
        required: true
        default: "26.6"

permissions:
  contents: write

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVICE_DIR: ${{ github.workspace }}/device
      DIAG_DIR: ${{ github.workspace }}/unixnu/out/houji/logs
      XCODE_INPUT: ${{ inputs.xcode }}
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          # Pinned while upstream main produces a kernel that faults before kprintf on
          # this board (run 108). 1c9261527e7e is the revision the validated run 99
          # kernel was built from; the video-console patch is applied on top of it here.
          ref: 1c9261527e7e90f0eb0f263afeda80598fdd5cd0
          path: unixnu
          persist-credentials: false

      - name: Retarget the dangling ArmCpu submodule pin
        working-directory: unixnu
        run: |
          set -o pipefail
          mkdir -p "$DIAG_DIR"
          {
            # Upstream pins drivers/ArmCpu to 2e11cda72740b985dedde3e32ba72b0fd64eb475,
            # which the repository no longer serves ("upload-pack: not our ref"). A plain
            # recursive submodule update aborts there and leaves every later submodule
            # (including kits/XnuPrelink) unchecked out. Resolve a commit that exists,
            # rewrite the parent index entry, then let the normal recursive update run.
            git submodule init
            armcpu_main="$(git ls-remote https://github.com/UniXNU/ArmCpu.git refs/heads/main | awk '{print $1}')"
            test -n "$armcpu_main"
            echo "unixnu: retargeting drivers/ArmCpu from the dangling pin to $armcpu_main"
            git update-index --cacheinfo 160000,"$armcpu_main",drivers/ArmCpu
            git submodule update --init --recursive
            test -f drivers/ArmCpu/ArmCpu.cpp
            git -C drivers/ArmCpu rev-parse --short HEAD
            test -d kits/XnuPrelink/patches
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Check out houji device repository
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Validate runner
        run: |
          # A push-triggered run has no workflow inputs, so resolve Xcode from the
          # runner rather than trusting the dispatch-only input path.
          selected=""
          for candidate in "/Applications/Xcode_${XCODE_INPUT:-26.6}.app/Contents/Developer" \
                           "$(xcode-select -p)" /Applications/Xcode.app/Contents/Developer; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "no usable Xcode found on this runner"
            ls -d /Applications/Xcode* 2>/dev/null || true
            exit 1
          fi
          echo "selected DEVELOPER_DIR=$selected"
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$selected"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find mig
          for tool in git make clang cmake ninja unifdef; do command -v "$tool"; done
          mkdir -p "$DIAG_DIR"

      - name: Configure and fetch sources
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            ./unixnu defconfig houji_defconfig -D "$DEVICE_DIR"
            ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 -D "$DEVICE_DIR"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply XNU compatibility patch
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            ./unixnu tree -D "$DEVICE_DIR"
            # XNU's os/log.c includes this private libdispatch header. Some
            # libdispatch revisions do not install it through xcodebuild, so
            # stage it explicitly in the reproducible kernel fakeroot.
            firehose_header=$(find -L out/houji/tree/refer/libdispatch out/feeds -path '*/os/firehose_buffer_private.h' -type f -print -quit 2>/dev/null || true)
            test -n "$firehose_header"
            for destination in \
              out/houji/tree/.cache/fakeroot/usr/include/os/firehose_buffer_private.h \
              out/houji/tree/.cache/fakeroot/usr/local/include/os/firehose_buffer_private.h; do
              mkdir -p "$(dirname "$destination")"
              cp "$firehose_header" "$destination"
              test -f "$destination"
            done
            git -C out/houji/tree/refer/xnu apply "$DEVICE_DIR/patches/xnu-iorpc-message-from-mach.patch"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply NativeAES 2212 fix
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            aes_src=$(find -L drivers out/houji/tree -name NativeAES.cpp -type f -print -quit)
            if [ -z "$aes_src" ]; then
              echo "NativeAES.cpp not found; tree layout:"
              find out/houji/tree -maxdepth 3 -type d -print | sort | head -n 60
              exit 1
            fi
            aes_dir=$(dirname "$aes_src")
            echo "NativeAES source: $aes_src"
            test -f "$DEVICE_DIR/patches/native-aes-2212.patch"
            if grep -q 'selector == 2212' "$aes_src"; then
              echo "NativeAES 2212 support already present, skipping patch"
            else
              (cd "$aes_dir" && (git apply --verbose "$DEVICE_DIR/patches/native-aes-2212.patch" \
                || patch -p1 -f --batch --forward < "$DEVICE_DIR/patches/native-aes-2212.patch")) < /dev/null
            fi
            grep -n 'selector == 2212' "$aes_src"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Bind NativeAES base entry points to the kernel IOService
        working-directory: unixnu
        env:
          PYTHONPATH: ${{ env.DEVICE_DIR }}/ci-hooks
        run: |
          set -o pipefail
          mkdir -p "$DIAG_DIR"
          {
            # The build compiles bindings it generates itself, so patch the generator too.
            # macOS runners still ship bash 3.2, which has no mapfile.
            generators=$(find -L . -name 'build-native-aes-bindings.py' -type f -print)
            bindings=$(find -L . -name native-aes-original-bindings.S -type f -print)
            test -n "$generators"
            echo "native AES generators:"
            echo "$generators"
            # The build generates its own copy of this script, so this is best effort; the
            # sitecustomize hook installed for the build step does the real work.
            python3 "$DEVICE_DIR/scripts/patch-native-aes-bindings-script.py" $generators || true
            for file in $bindings; do
              python3 "$DEVICE_DIR/scripts/bind-native-aes-tors.py" "$file" || true
            done
            test -f "$DEVICE_DIR/ci-hooks/sitecustomize.py"
            python3 -c 'import sitecustomize; print("sitecustomize hook ready")'
            echo "native AES constructors no longer jump into unpopulated prelink text"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Order driver object archives in board.toml
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            set +e
            # Each bindings archive links the driver object that build-arm-driver.py
            # compiles, and neither script creates the other's output directory. Both
            # drivers and both bindings scripts have been renamed upstream, and the
            # virtio bindings step cannot run without an original-kernelcache audit
            # this board never generates, so the board now lists that driver directly.
            # Resolve everything from the tree this run actually checked out rather
            # than hard-coding a revision here.
            python3 - "$DEVICE_DIR/board.toml" out/houji/tree "$DIAG_DIR" <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          board_path, tree, diag = Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3])
          scripts, drivers = tree / 'scripts', tree / 'drivers'
          print('tree:', tree, 'exists' if tree.is_dir() else 'MISSING')
          print('driver directories:', sorted(p.name for p in drivers.iterdir()) if drivers.is_dir() else 'absent')
          print('bindings scripts in tree:', sorted(p.name for p in scripts.glob('*bindings*.py')) if scripts.is_dir() else 'absent')

          components = []
          manifest = tree / 'components.toml'
          if manifest.is_file():
              components = tomllib.loads(manifest.read_text())['component']
          else:
              print('tree has no components.toml, falling back to legacy component names')

          accepted = None
          arm_driver = scripts / 'build-arm-driver.py'
          if arm_driver.is_file():
              for line in arm_driver.read_text(errors='replace').splitlines():
                  if 'choices=[' in line:
                      accepted = set(re.findall(r"['\"]([^'\"]+)['\"]", line))
                      break
          print('literal build-arm-driver.py choices:', sorted(accepted) if accepted else 'catalog derived')


          def driver(pattern, fallback):
              for entry in components:
                  if entry.get('kind') != 'driver':
                      continue
                  names = [entry.get('id', ''), entry.get('legacy_name', '')]
                  if not any(re.search(pattern, name or '', re.I) for name in names):
                      continue
                  identifier = entry['id']
                  legacy = entry.get('legacy_name', identifier)
                  chosen = identifier
                  if accepted is not None and identifier not in accepted:
                      chosen = legacy
                  elif not (drivers / identifier).is_dir() and (drivers / legacy).is_dir():
                      chosen = legacy
                  build = entry.get('build')
                  invocation = 'build-arm-driver.py ' + chosen
                  if build and chosen == identifier:
                      invocation = ' '.join(build)
                  archive = next((path for path in entry.get('outputs', []) if path.endswith('.a')), None)
                  return {
                      'invocation': invocation,
                      'objects_dir': str(tree / Path(archive).parent) if archive else None,
                  }
              return {'invocation': 'build-arm-driver.py ' + fallback, 'objects_dir': None}


          def script(pattern, current, fallback):
              candidates = sorted(p.name for p in scripts.glob('*.py')) if scripts.is_dir() else []
              matching = [name for name in candidates if re.search(pattern, name, re.I)]
              if current in matching:
                  return current
              if matching:
                  return matching[0]
              return fallback


          def objects_dir(script_name):
              for line in (scripts / script_name).read_text(errors='replace').splitlines():
                  if '--objects-dir' in line:
                      quoted = re.findall(r"'([^']+)'", line)
                      if quoted:
                          return str(tree / quoted[-1])
              return None


          text = board_path.read_text()
          block = re.search(r'^archives = \[\n(.*?)^\]', text, re.S | re.M)
          if not block:
              raise SystemExit('board.toml has no multi-line archives list')
          entries = [m.group(1) for m in re.finditer(r'"([^"]+)"', block.group(1))]


          def family(name):
              lowered = name.lower()
              if 'aes' in lowered:
                  return 'aes'
              if 'virtio' in lowered or 'mmio' in lowered:
                  return 'virtio'
              return None


          def kind(name):
              if not name.endswith('bindings.py'):
                  return None
              return family(name)


          def listed_driver(entry):
              parts = entry.split()
              if len(parts) != 2 or not parts[0].endswith('build-arm-driver.py'):
                  return None
              return family(parts[1])


          wanted = {'aes': (r'aes[^ ]*bindings\.py', r'aes', 'NativeAES'),
                    'virtio': (r'(?:virtio|mmio)[^ ]*bindings\.py', r'virtio.*block|block.*virtio', 'NativeVirtioBlock')}
          targets = {}
          for entry in entries:
              first = entry.split()[0]
              found, role = kind(first), 'bindings'
              if not found:
                  found, role = listed_driver(entry), 'driver'
              if not found or found in targets:
                  continue
              binding_pattern, driver_pattern, legacy = wanted[found]
              drv = driver(driver_pattern, legacy)
              targets[found] = (drv, script(binding_pattern, first, first) if role == 'bindings' else None)

          for found, (drv, resolved) in targets.items():
              if resolved is None:
                  print('%s: driver=%s bindings=none (linked by the kernel build) objects=%s'
                        % (found, drv['invocation'], drv['objects_dir']))
                  continue
              if not (scripts / resolved).is_file():
                  raise SystemExit('no %s bindings script found in tree (board asked for %s)' % (found, resolved))
              drv['objects_dir'] = drv['objects_dir'] or objects_dir(resolved)
              print('%s: driver=%s bindings=%s objects=%s' % (found, drv['invocation'], resolved, drv['objects_dir']))

          # A board may mention only one family: a driver whose base class lives in the
          # prelinked IOStorageFamily kext needs an audited prelink before it can link.
          mentioned = set()
          for entry in entries:
              found = kind(entry.split()[0]) or listed_driver(entry)
              if found:
                  mentioned.add(found)
          absent = [found for found in sorted(mentioned) if found not in targets]
          if absent:
              raise SystemExit('board.toml mentions %s but the tree resolves neither driver nor bindings'
                               % ', '.join(absent))

          result = []
          emitted = set()
          for entry in entries:
              name = entry.split()[0]
              found = kind(name)
              if found:
                  drv, resolved = targets[found]
                  entry = resolved + entry[len(name):]
                  if drv['invocation'] not in emitted:
                      result.append(drv['invocation'])
                      emitted.add(drv['invocation'])
                  result.append(entry)
                  continue
              found = listed_driver(entry)
              if found and found in targets:
                  invocation = targets[found][0]['invocation']
                  if invocation not in emitted:
                      result.append(invocation)
                      emitted.add(invocation)
                  continue
              result.append(entry)

          body = ''.join('  "%s",\n' % entry for entry in result)
          board_path.write_text(text[:block.start()] + 'archives = [\n' + body + ']' + text[block.end():])
          tomllib.loads(board_path.read_text())
          print('archives rewritten: %d entries, board.toml still parses' % len(result))
          for entry in result:
              print('  archive:', entry)

          directories = [drv['objects_dir'] for drv, _ in targets.values() if drv['objects_dir']]
          (diag / 'objects-dirs.txt').write_text(''.join(d + '\n' for d in directories))
          PY
            echo "board archive rewrite rc=$?"
            while read -r objects; do
              [ -n "$objects" ] || continue
              mkdir -p "$objects" && echo "prepared objects directory $objects"
            done < "$DIAG_DIR/objects-dirs.txt"
            cat "$DEVICE_DIR/board.toml"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Prepare XNU host header staging
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            python3 - <<'PY'
          from pathlib import Path
          path = Path("out/houji/tree/scripts/build-xnu-4k-baseline.sh")
          text = path.read_text()
          marker = "  git clone --shared refer/xnu .cache/xnu-work\n"
          copy = marker + "  mkdir -p .cache/xnu-work/EXTERNAL_HEADERS/os\n  firehose=$(find . -path '*/os/firehose_buffer_private.h' -type f -print -quit 2>/dev/null || true)\n  if [ -n \"$firehose\" ]; then cp \"$firehose\" .cache/xnu-work/EXTERNAL_HEADERS/os/firehose_buffer_private.h; fi\n"
          if marker not in text:
              raise SystemExit("XNU clone marker not found")
          if "firehose=$(find refer/libdispatch ../feeds" not in text:
              text = text.replace(marker, copy, 1)
              path.write_text(text)
          print(f"prepared {path}")
          PY
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply persistent early-log patch
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/native-persistent-early-log.patch"
            test -f "$patch"
            git -C out/houji/tree/refer/xnu apply --check "$patch"
            git -C out/houji/tree/refer/xnu apply "$patch"
            git -C out/houji/tree/refer/xnu diff --check
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply user-thread SVC trace
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/svctrace-initproc.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q 'HOUJI-SVCTRACE-v' "$xnu/osfmk/arm64/sleh.c"
            echo "SVC trace is present in sleh.c"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply user fault log
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/user-fault-log.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q HOUJI-FAULT-v2 "$xnu/osfmk/arm64/sleh.c"
            echo "user fault log is present in sleh.c"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply pid-1 user fault probe
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/ufault-probe.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q unixnu_uf_init "$xnu/osfmk/arm64/sleh.c"
            echo "pid-1 user fault probe is present in sleh.c"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply NVRAM redundant-write dedup
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/nvdedup.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q HOUJI-NVDEDUP-v1 "$xnu/iokit/Kernel/IONVRAMCHRPHandler.cpp"
            echo "NVRAM dedup is present in IONVRAMCHRPHandler.cpp"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply shared-cache CS-monitor bypass
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/srcache-noreject.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q HOUJI-SRCACHE "$xnu/osfmk/vm/vm_fault.c"
            echo "shared-cache CS-monitor bypass is present in vm_fault.c"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply shared-cache kernel probe
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/srcache-probe.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q 'HOUJI-SRCACHE-v1' "$xnu/bsd/vm/vm_unix.c"
            echo "shared-cache probe is present in vm_unix.c"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply shared-cache dynamic page mapping
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/srcache-dynamic.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q unixnu_srcache_map_anonymous "$xnu/osfmk/vm/vm_shared_region.c"
            echo "shared-cache dynamic page mapping is present in vm_shared_region.c"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply XNU shared-cache MACF bypass
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/skip-shared-cache-macf-check.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q 'skipping MACF signature check' "$xnu/bsd/kern/ubc_subr.c"
            echo "shared-cache MACF bypass is present in ubc_subr.c"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply HOUJI text video console patch
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/video-console.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q 'HOUJI-VIDEO' "$xnu/pexpert/arm/pe_init.c"
            echo "video console depth fix is present in pe_init.c"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply console ring and corpse limits
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            xnu=out/houji/tree/refer/xnu
            for patch in "$DEVICE_DIR/patches/xnu/con-ring.patch" "$DEVICE_DIR/patches/xnu/corpse-limit.patch" "$DEVICE_DIR/patches/xnu/msgbuf-16m.patch" "$DEVICE_DIR/patches/xnu/cryptex-namei-fallback.patch" "$DEVICE_DIR/patches/xnu/cs-overlay-platform.patch"; do
              test -f "$patch"
              if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
                git -C "$xnu" apply "$patch"
              else
                echo "git apply refused $patch, retrying with patch and fuzz"
                (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
              fi
            done
            grep -q HOUJI_CON_RING_SIZE "$xnu/osfmk/console/video_console.c"
            grep -q 'TOTAL_CORPSES_ALLOWED 64' "$xnu/osfmk/corpses/task_corpse.h"
            echo "console ring and corpse limits are present"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Apply deferred entropy SHA-512 init
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/defer-entropy-sha512-until-kiec.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q 'entropy_sha512_start' "$xnu/osfmk/prng/entropy.c"
            echo "deferred entropy SHA-512 init is present in entropy.c"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Use the device-tree panic region for the persistent log
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/dt-panic-region.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q '// #define PLATFORM_PANIC_LOG_PADDR' "$xnu/pexpert/pexpert/arm64/BCM2837.h"
            echo "kernel persistent log now comes from the DT pram region"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Map an out-of-aperture device-tree ramdisk
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            patch="$DEVICE_DIR/patches/xnu/ramdisk-outside-physmem.patch"
            test -f "$patch"
            xnu=out/houji/tree/refer/xnu
            if git -C "$xnu" apply --check "$patch" 2>/dev/null; then
              git -C "$xnu" apply "$patch"
            else
              echo "git apply refused, retrying with patch and fuzz"
              (cd "$xnu" && patch -p1 --forward --fuzz=3 < "$patch")
            fi
            grep -q 'pmap_map(ramdMap' "$xnu/iokit/bsddev/IOKitBSDInit.cpp"
            echo "out-of-aperture DT ramdisks are mapped with kmem_alloc + pmap_map"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Annotate prelink binding diagnostics
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            python3 - <<'PY'
          from pathlib import Path

          candidates = list(Path("kits").glob("*/native_prelink.py"))
          if not candidates:
              candidates = list(Path("out/houji/tree/kits").glob("*/native_prelink.py"))
          if len(candidates) != 1:
              raise SystemExit(f"expected one native_prelink.py, found: {candidates}")
          path = candidates[0]
          text = path.read_text()

          # The iOS 16 IOStorageFamily component imports this DriverKit-era
          # helper. The native BCM2837 build retains the corresponding local
          # IORPCMessageFromMachReply implementation, so expose local symbols
          # to the resolver and use that implementation as a compatibility
          # target when the C stub is dead-stripped.
          replacements = [
              ("def exports(data, image):", "def exports(data, image, include_local=False):"),
              ("        if kind & 0xe0 or not kind & 1 or not kind & 0x0e:",
               "        if kind & 0xe0 or not kind & 0x0e or (not include_local and not kind & 1):"),
              ("    for address, names in exports(native_data, native).items():",
               "    for address, names in exports(native_data, native, include_local=True).items():"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"prelink marker not found: {old}")
              text = text.replace(old, new, 1)

          old_choices = "    choices = {new for name in names for new in native_by_name.get(name, set())}"
          new_choices = (
              "    sets = [native_by_name.get(name, set()) for name in names]\n"
              "    common = set.intersection(*(set(values) for values in sets)) if sets else set()\n"
              "    if len(common) == 1:\n"
              "        return next(iter(common))\n"
              "    choices = set.union(*(set(values) for values in sets)) if sets else set()"
          )
          if old_choices not in text:
              raise SystemExit("unique binding choice line not found")
          text = text.replace(old_choices, new_choices, 1)

          anchor = "    packed = metadata['_PrelinkLinkKASLROffsets']"
          alias = (
              "    if '_IORPCMessageFromMach' not in native_symbols:\n"
              "        reply = {address for address, names in exports(native_data, native, include_local=True).items()\n"
              "                 if any('IORPCMessageFromMachReply' in name for name in names)}\n"
              "        if len(reply) == 1:\n"
              "            native_symbols['_IORPCMessageFromMach'] = reply\n"
              "            print('native prelink compatibility alias: _IORPCMessageFromMach -> IORPCMessageFromMachReply')\n"
          )
          if anchor not in text:
              raise SystemExit("prelink symbol anchor not found")
          text = text.replace(anchor, alias + anchor, 1)

          old = "            replacement = unique_kernel_binding(target, original_symbols, native_symbols)"
          new = (
              "            try:\n"
              "                replacement = unique_kernel_binding(target, original_symbols, native_symbols)\n"
              "            except ValueError as error:\n"
              "                queue = [(root, [root]) for root in roots]\n"
              "                seen = set()\n"
              "                paths = []\n"
              "                while queue:\n"
              "                    identifier, chain = queue.pop(0)\n"
              "                    if identifier in seen:\n"
              "                        continue\n"
              "                    seen.add(identifier)\n"
              "                    if identifier == source[2]:\n"
              "                        paths.append(' -> '.join(chain))\n"
              "                        continue\n"
              "                    entry = entries.get(identifier)\n"
              "                    if entry:\n"
              "                        queue.extend((dep, chain + [dep]) for dep in (entry.get('OSBundleLibraries') or {}))\n"
              "                raise ValueError(f\"{error}; source={source[2]}; site={site:#x}; roots={paths}\") from error"
          )
          if old not in text:
              raise SystemExit("prelink binding line not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          print(f"annotated {path}")
          PY
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"
      - name: Validate prelink compatibility scripts
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            # Resolve the board's build-tree alias to its actual submodule.
            prelink_kit="$(python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          board = tomllib.loads((Path(os.environ["DEVICE_DIR"]) / "board.toml").read_text())
          emitter = (Path("out/houji/tree") / board["kernel"]["prelink"]["tool"]).resolve(strict=True)
          if not emitter.is_file():
              raise SystemExit(f"prelink emitter is not a file: {emitter}")
          for name in ("native_prelink.py", "test_native_prelink.py", "test_emit_prelink.py"):
              if not (emitter.parent / name).is_file():
                  raise SystemExit(f"missing prelink source/test: {emitter.parent / name}")
          print(emitter.parent)
          PY
            )"
            echo "Resolved prelink kit: $prelink_kit"
            echo "PRELINK_KIT=$prelink_kit" >> "$GITHUB_ENV"
            # Strip a/kits/NativePrelink/ and apply inside the resolved submodule.
            git -C "$prelink_kit" apply -p3 --check "$DEVICE_DIR/patches/prelink-ios16-libm-literal.patch"
            git -C "$prelink_kit" apply -p3 "$DEVICE_DIR/patches/prelink-ios16-libm-literal.patch"
            python3 -m py_compile "$prelink_kit/native_prelink.py" "$prelink_kit/emit_prelink.py"
            python3 -m unittest discover -s "$prelink_kit" -p 'test_*.py'
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Ensure ArmCpu sources are present in the build tree
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            echo "== ArmCpu tree state =="
            readlink -f out/houji/tree/drivers/ArmCpu || true
            ls -la out/houji/tree/drivers/ArmCpu 2>/dev/null | head -20 || true
            # The upstream pin is gone and the submodule machinery can leave an
            # empty checkout; make the tree point at real sources before compiling.
            if [ ! -f out/houji/tree/drivers/ArmCpu/ArmCpu.cpp ]; then
              echo "ArmCpu.cpp missing; materialising UniXNU/ArmCpu main"
              git -C drivers/ArmCpu fetch --depth 1 origin main || true
              git -C drivers/ArmCpu checkout -q -f FETCH_HEAD || true
              if [ ! -f drivers/ArmCpu/ArmCpu.cpp ]; then
                rm -rf /tmp/armcpu-src
                mkdir -p /tmp/armcpu-src
                curl -sSL --retry 4 -o /tmp/armcpu.tar.gz \
                  https://api.github.com/repos/UniXNU/ArmCpu/tarball/main
                tar -xzf /tmp/armcpu.tar.gz -C /tmp/armcpu-src
                cp -a /tmp/armcpu-src/UniXNU-ArmCpu-*/. drivers/ArmCpu/
              fi
            fi
            test -f out/houji/tree/drivers/ArmCpu/ArmCpu.cpp
            echo "ArmCpu sources OK"
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Overlay and enable NativeUfs
        working-directory: unixnu
        run: |
          set -o pipefail
          mkdir -p "$DIAG_DIR"
          DEVICE_DIR="$DEVICE_DIR" python3 "$DEVICE_DIR/vendor/enable-nativeufs.py" 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Overlay NativeRamBlock
        working-directory: unixnu
        run: |
          set -o pipefail
          mkdir -p "$DIAG_DIR"
          DEVICE_DIR="$DEVICE_DIR" python3 "$DEVICE_DIR/vendor/enable-nativeramblock.py" 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Overlay NativeMobileDisplay
        working-directory: unixnu
        run: |
          set -o pipefail
          mkdir -p "$DIAG_DIR"
          DEVICE_DIR="$DEVICE_DIR" python3 "$DEVICE_DIR/vendor/enable-native-legacy-display.py" 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Build houji kernel
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Rewrites the AES bindings the build generates (see ci-hooks/sitecustomize.py).
          PYTHONPATH: ${{ env.DEVICE_DIR }}/ci-hooks
        run: |
          set -o pipefail
          mkdir -p out/houji/logs
          python3 "$DEVICE_DIR/scripts/patch-unixnu-kernel-firehose.py" scripts/unixnu/kernel.py
          python3 -m py_compile scripts/unixnu/kernel.py
          set +e
          ./unixnu build kernel -D "$DEVICE_DIR" -j 3 2>&1 | tee out/houji/logs/github-build.log
          build_status=${PIPESTATUS[0]}
          echo "UniXNU kernel build exit status: ${build_status}" | tee -a out/houji/logs/github-build.log
          if [ "$build_status" -ne 0 ] && [ -f out/houji/logs/kernel-bootstrap.log ]; then
            echo "=== first bootstrap compiler errors ===" | tee -a out/houji/logs/github-build.log
            grep -n -E 'fatal error:|error: ' out/houji/logs/kernel-bootstrap.log | head -n 30 | tee -a out/houji/logs/github-build.log || true
          fi
          # A bootstrap pass can succeed while the archive phase is skipped by an
          # older driver tree. Build the declared archives once and retry only when
          # the final kernel reports the namespaced corecrypto archive is missing.
          crypto_archive="out/houji/tree/build/corecrypto-2023/libcorecrypto_kernel_noasm-namespaced.a"
          if [ "$build_status" -ne 0 ] && [ ! -f "$crypto_archive" ] && grep -q 'CRYPTO_ARCHIVE\|corecrypto_kernel_noasm-namespaced' out/houji/logs/kernel.log 2>/dev/null; then
            echo "Retrying archive phase: namespaced corecrypto archive is missing" | tee -a out/houji/logs/github-build.log
            set -x
            python3 out/houji/tree/scripts/build-corecrypto-14.py 2>&1 | tee out/houji/logs/retry-archive-01-build-corecrypto-14.log
            python3 out/houji/tree/scripts/build-corecrypto-14.py --namespace 2>&1 | tee out/houji/logs/retry-archive-02-build-corecrypto-14.log
            python3 out/houji/tree/scripts/build-arm-driver.py ArmDTPlatform 2>&1 | tee out/houji/logs/retry-archive-03-build-arm-driver.log
            python3 out/houji/tree/scripts/build-arm-driver.py ArmCpu 2>&1 | tee out/houji/logs/retry-archive-04-build-arm-driver.log
            python3 out/houji/tree/scripts/build-arm-driver.py NativeUfs 2>&1 | tee out/houji/logs/retry-archive-06-build-nativeufs.log
            python3 out/houji/tree/scripts/build-libpthread-kernel.py 2>&1 | tee out/houji/logs/retry-archive-05-build-libpthread-kernel.log
            test -f "$crypto_archive" || { echo "retry archive still missing: $crypto_archive" | tee -a out/houji/logs/github-build.log; exit 1; }
            set +x
            ./unixnu build kernel -D "$DEVICE_DIR" -j 3 2>&1 | tee out/houji/logs/github-build-retry.log
            build_status=${PIPESTATUS[0]}
            echo "UniXNU kernel retry exit status: ${build_status}" | tee -a out/houji/logs/github-build.log
          fi
          exit "$build_status"

      - name: Build NativeLegacyDisplay and relink the kernel
        continue-on-error: true
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ env.DEVICE_DIR }}/ci-hooks
        run: |
          set -o pipefail
          mkdir -p "$DIAG_DIR"
          {
            set -x
            T=out/houji/tree
            mkdir -p "$T/build/native-prelink"
            cp out/houji/kernel/kernel.macho "$T/build/native-prelink/native-owner-mobile-graphics-candidate.macho"
            cp out/houji/kernel/kernel.json "$T/build/native-prelink/native-owner-mobile-graphics-candidate.json"
            cp out/houji/kernel/kernel.macho "$T/build/native-prelink/native-owner-ufs-cpu-desktop-houji-candidate.macho"
            cp out/houji/kernel/kernel.json "$T/build/native-prelink/native-owner-ufs-cpu-desktop-houji-candidate.json"
            cd "$T"
            python3 scripts/audit-mobile-graphics-legacy.py
            python3 scripts/build-native-legacy-display.py
            ls -la build/native-legacy-display
            cd "$GITHUB_WORKSPACE/unixnu"
            sed -i 's/CONFIG_XNU_NATIVE_LEGACY_DISPLAY=n/CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y/' "$DEVICE_DIR/configs/houji_defconfig"
            grep LEGACY_DISPLAY "$DEVICE_DIR/configs/houji_defconfig"
            ./unixnu build kernel -D "$DEVICE_DIR" -j 3 2>&1 | tee out/houji/logs/github-build-display.log
            ls -la out/houji/kernel/kernel.macho
          } 2>&1 | tee "$DIAG_DIR/display.log"
          exit "${PIPESTATUS[0]}"

      - name: Verify the AES base binding reached the kernel
        working-directory: unixnu
        run: |
          kernel=out/houji/kernel/kernel.macho
          test -f "$kernel"
          nm -a "$kernel" > /tmp/kernel-nm.txt 2>/dev/null || true
          if grep -q 'A __ZN16IOAESAcceleratorC2EPK11OSMetaClass$' /tmp/kernel-nm.txt; then
            grep 'A __ZN16IOAESAcceleratorC2EPK11OSMetaClass$' /tmp/kernel-nm.txt
            echo "AES base constructor is still bound to an absolute address"
            exit 1
          fi
          if grep -q '__ZN16IOAESAcceleratorC2EPK11OSMetaClass' /tmp/kernel-nm.txt; then
            echo "AES base constructor is bound in the image (thunk)"
          else
            echo "warning: AES base constructor symbol not found in the image"
          fi

      - name: Audit IOBlockStorageDevice ABI (diagnostic)
        if: always()
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR" out/houji/logs
          {
            kernel=out/houji/kernel/kernel.macho
            if [ -f "$kernel" ]; then
              echo "=== IOBlockStorageDevice symbols in CI candidate ==="
              nm -a "$kernel" 2>/dev/null | grep -c IOBlockStorageDevice || true
              nm -a "$kernel" 2>/dev/null | grep IOBlockStorageDevice | head -20 || true
              echo "=== run storage ABI audit ==="
              NATIVE_PRELINK_PATH="$PRELINK_KIT" python3 "$DEVICE_DIR/scripts/audit-storage-candidate.py" \
                "$kernel" out/houji/logs/storage-interface-audit.json \
                || echo "AUDIT FAILED (candidate may not export IOBlockStorageDevice)"
            else
              echo "no kernel candidate to audit"
            fi
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Build APFS Data seed (hdiutil, sheng method)
        if: always()
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR" out/houji/kernel
          {
            set -e
            rm -f /tmp/houji-data.cdr
            hdiutil create -size 64m -layout NONE -fs APFS -volname houjiData -type UDTO /tmp/houji-data.cdr
            rm -rf /tmp/houji-mnt; mkdir -p /tmp/houji-mnt
            hdiutil attach -nobrowse -owners off -mountpoint /tmp/houji-mnt /tmp/houji-data.cdr > /tmp/houji-att.txt
            mkdir -p /tmp/houji-mnt/keybags /tmp/houji-mnt/mobile/tmp /tmp/houji-mnt/tmp /tmp/houji-mnt/run
            chmod 1777 /tmp/houji-mnt/tmp
            hdiutil detach /tmp/houji-mnt || true
            cp /tmp/houji-data.cdr out/houji/kernel/data-seed.raw
            python3 -c "d=open('out/houji/kernel/data-seed.raw','rb').read(); print('seed bytes', len(d), 'magic', d[32:36])"
            gzip -f out/houji/kernel/data-seed.raw
            ls -la out/houji/kernel/data-seed.raw.gz
            shasum -a 256 out/houji/kernel/data-seed.raw.gz
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Check pinned iOS16 prelink inputs
        if: always()
        working-directory: unixnu
        run: |
          mkdir -p "$DIAG_DIR"
          {
            cache=out/ipsw/20H392/kernelcache.decompressed
            if [ -f "$cache" ]; then
              python3 "$DEVICE_DIR/scripts/verify-prelink-ios16.py" \
                --kit "$PRELINK_KIT" --kernelcache "$cache" \
                --board "$DEVICE_DIR/board.toml" \
                --output out/houji/logs/prelink-ios16-validation.json
            fi
          } 2>&1 | tee -a "$DIAG_DIR/early-steps.log"

      - name: Collect kernel build diagnostics
        if: always()
        working-directory: unixnu
        run: |
          mkdir -p out/houji/logs
          {
            echo "=== runner ==="
            date -u
            xcodebuild -version || true
            xcrun --sdk iphoneos --show-sdk-version || true
            echo "=== source revisions ==="
            git rev-parse HEAD || true
            git -C "$DEVICE_DIR" rev-parse HEAD || true
            echo "=== output files ==="
            find out/houji -maxdepth 5 -type f -print 2>/dev/null | sort || true
            echo "=== build configuration and required archives ==="
            test -f out/houji/.config && cat out/houji/.config || true
            find out/houji/tree/build/corecrypto-2023 -maxdepth 1 -type f -print -exec shasum -a 256 {} \; 2>/dev/null || true
            test -f out/houji/tree/build/corecrypto-2023/libcorecrypto_kernel_noasm-namespaced.a && echo "PASS corecrypto namespaced archive" || echo "MISSING corecrypto namespaced archive"
            echo "=== compiler/link/test failure matches ==="
            for log in out/houji/logs/*.log; do
              [ -f "$log" ] || continue
              echo "--- ${log} failure matches ---"
              grep -n -E '(^|[[:space:]])(fatal )?error:|undefined reference|duplicate symbol|No such file|test -f .* failed|make(\[[0-9]+\])?: \*\*\*|command failed' "$log" | tail -n 120 || true
            done
            echo "=== IORPC native symbol diagnostics ==="
            native="out/houji/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
            if [ -f "$native" ]; then
              nm -an "$native" 2>/dev/null | grep -E 'IORPCMessageFromMach|IOUserServer' | tail -40 || true
              grep -R -n 'IOUserServer.cpp' out/houji/tree/build/xnu 2>/dev/null | tail -20 || true
            fi
            echo "=== log tails ==="
            for log in out/houji/logs/*.log; do
              [ -f "$log" ] || continue
              echo "--- ${log} (last 250 lines) ---"
              tail -n 250 "$log" || true
            done
            echo "=== native-ufs compile log (last 200 lines) ==="
            tail -n 200 out/houji/tree/build/native-ufs/compile.log 2>/dev/null || true
            echo "=== native-ufs compile command ==="
            cat out/houji/tree/build/native-ufs/compile-command.json 2>/dev/null || true
          } | tee out/houji/logs/github-diagnostics.log

      - name: Hash kernel artifact
        if: success()
        working-directory: unixnu
        run: shasum -a 256 out/houji/kernel/kernel.macho > out/houji/kernel/kernel.macho.sha256

      - name: Upload kernel and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: houji-xnu-kernel-${{ github.run_number }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            unixnu/out/houji/**
            unixnu/out/houji/kernel/kernel.macho
            unixnu/out/houji/kernel/kernel.json
            unixnu/out/houji/kernel/kernel.macho.sha256
            unixnu/out/houji/logs/**/*.log
            unixnu/out/houji/.config
            device/unixnu.lock

      # Console logs are only readable with an API token, which this workspace
      # does not have, so publish the collected logs and the kernel image on
      # paths that anonymous HTTP can read: the ci-kernel-mrk branch for text
      # and a release for the binaries.
      - name: Publish CI diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$DIAG_DIR"
          {
            echo "=== run meta ==="
            echo "run ${GITHUB_RUN_NUMBER} attempt ${GITHUB_RUN_ATTEMPT} job ${GITHUB_JOB}"
            echo "commit ${GITHUB_SHA} branch ${GITHUB_REF_NAME} trigger ${GITHUB_EVENT_NAME}"
            echo "unixnu $(git -C unixnu rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "device $(git -C "$DEVICE_DIR" rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "selected DEVELOPER_DIR ${DEVELOPER_DIR:-unset}"
            echo "=== files under unixnu/out/houji (maxdepth 4) ==="
            find unixnu/out/houji -maxdepth 4 -type f -print 2>/dev/null | sort | head -n 200
            echo "=== early-steps.log tail ==="
            tail -n 300 "$DIAG_DIR/early-steps.log" 2>/dev/null || echo "(no early-steps.log)"
          } > "$DIAG_DIR/run-meta.log"
          {
            cat "$DIAG_DIR/run-meta.log"
            echo "=== github-diagnostics.log tail ==="
            tail -n 1200 "$DIAG_DIR/github-diagnostics.log" 2>/dev/null || echo "(no github-diagnostics.log)"
          } > "$DIAG_DIR/latest.log"
          stage=$(mktemp -d)
          git init -q "$stage/diag"
          git -C "$stage/diag" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$stage/diag" config user.name houji-ci
          git -C "$stage/diag" config user.email houji-ci@users.noreply.github.com
          git -C "$stage/diag" checkout -q -B ci-kernel-mrk
          dest="$stage/diag/run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          mkdir -p "$dest"
          cp "$DIAG_DIR"/*.log "$dest/" 2>/dev/null || true
          cp "$DIAG_DIR/latest.log" "$stage/diag/run-latest.log" 2>/dev/null || true
          git -C "$stage/diag" add -f -A
          git -C "$stage/diag" commit -q -m "diagnostics for run ${GITHUB_RUN_NUMBER} ($(echo "$GITHUB_REF_NAME" | cut -c1-20) ${GITHUB_SHA:0:7})" || echo "nothing new to publish"
          if GIT_TERMINAL_PROMPT=0 git -C "$stage/diag" push -f origin ci-kernel-mrk; then
            echo "diagnostics branch: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-kernel-mrk/run-latest.log"
          else
            echo "DIAG_BRANCH_PUSH_FAILED"
          fi
          if [ -s unixnu/out/houji/kernel/kernel.macho ]; then
            tag="ci-kernel-${GITHUB_RUN_NUMBER}"
            files=(unixnu/out/houji/kernel/kernel.macho)
            for extra in kernel.macho.sha256 kernel.json; do
              p=unixnu/out/houji/kernel/$extra
              if [ -s "$p" ]; then files+=("$p"); fi
            done
            if gh release create "$tag" --target "$GITHUB_SHA" \
                 --title "houji kernel run ${GITHUB_RUN_NUMBER}" \
                 --notes "Automated build of ${GITHUB_SHA} on ${GITHUB_REF_NAME}." \
                 "${files[@]}" > "$DIAG_DIR/release.log" 2>&1; then
              echo "kernel release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            else
              echo "KERNEL_RELEASE_FAILED"
            fi
            cat "$DIAG_DIR/release.log" || true
            # A release depends on the API and on a token scope that run 66 proved
            # unreliable, and this workspace cannot read raw file URLs at all. The
            # diagnostics branch is writable and reachable over git+ssh, so the image
            # is committed there too and the boot pipeline fetches it from git.
            mkdir -p "$stage/diag/kernels"
            cp unixnu/out/houji/kernel/kernel.macho "$stage/diag/kernels/run-${GITHUB_RUN_NUMBER}-kernel.macho"
            for extra in kernel.macho.sha256 kernel.json; do
              p=unixnu/out/houji/kernel/$extra
              if [ -s "$p" ]; then cp "$p" "$stage/diag/kernels/run-${GITHUB_RUN_NUMBER}-${extra}"; fi
            done
            if [ -s unixnu/out/houji/kernel/data-seed.raw.gz ]; then
              cp unixnu/out/houji/kernel/data-seed.raw.gz "$stage/diag/kernels/run-${GITHUB_RUN_NUMBER}-data-seed.raw.gz"
            fi
            if [ -s "$DIAG_DIR/release.log" ]; then
              cp "$DIAG_DIR/release.log" "$stage/diag/kernels/run-${GITHUB_RUN_NUMBER}-release.log"
            fi
            git -C "$stage/diag" add -f kernels
            git -C "$stage/diag" commit -q -m "kernel for run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" \
              || echo "kernel already on the branch"
            if GIT_TERMINAL_PROMPT=0 git -C "$stage/diag" push -f origin ci-kernel-mrk; then
              echo "KERNEL_BRANCH_PUSHED kernels/run-${GITHUB_RUN_NUMBER}-kernel.macho"
            else
              echo "KERNEL_BRANCH_PUSH_FAILED"
            fi
          else
            echo "no kernel.macho produced"
          fi
