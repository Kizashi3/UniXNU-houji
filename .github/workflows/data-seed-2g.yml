name: houji 2 GiB Data seed

on:
  workflow_dispatch:
  push:
    branches: [kernel-cs-bypass, gpu-vktest-launchd, codex/gpu-metal-ios16]
    paths:
      - ".github/workflows/data-seed-2g.yml"
      - "scripts/make-data-seed.py"
      - "scripts/seed-skip-setup.py"

permissions:
  contents: write

jobs:
  seed:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build a 2 GiB Data seed with NativeAdrenoMetal, vktest, and mtltest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          exec > >(tee /tmp/seed.log) 2>&1
          SRC="$RUNNER_TEMP/system-source"
          mkdir -p "$SRC/ipsw/20H392"
          STAGE="$RUNNER_TEMP/fwstage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          gh release download fw-cache-20H392 --repo "$GITHUB_REPOSITORY" --dir "$STAGE"
          python3 scripts/merged-root-fwcache.py unpack "$STAGE" "$SRC"
          rm -rf "$STAGE"
          DMG="$SRC/ipsw/20H392/087-86698-044.dmg"
          MNT="$RUNNER_TEMP/os-mount"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"

          SEED_DIR="$RUNNER_TEMP/gpu-seed"
          METAL_DIR="$RUNNER_TEMP/metal"
          rm -rf "$SEED_DIR" "$METAL_DIR"
          mkdir -p "$SEED_DIR" "$METAL_DIR/artifact"
          gh release download data-seed-2g-22 --repo "$GITHUB_REPOSITORY" \
            --pattern owner-data-2048-skip.cdr.gz --dir "$SEED_DIR"
          gzip -dc "$SEED_DIR/owner-data-2048-skip.cdr.gz" > "$SEED_DIR/base.cdr"
          gh release download metal-ios16-7 --repo "$GITHUB_REPOSITORY" \
            --pattern houji-metal-ios16.tar.gz --dir "$METAL_DIR"
          tar -xzf "$METAL_DIR/houji-metal-ios16.tar.gz" -C "$METAL_DIR/artifact"
          (cd "$METAL_DIR/artifact" && shasum -a 256 -c SHA256SUMS)

          sudo python3 scripts/seed-skip-setup.py "$SEED_DIR/base.cdr" \
            "$SEED_DIR/owner-data-2048-metal-probe.cdr" --preserve-services \
            --gpu-probe-dir "$METAL_DIR/artifact" \
            --launchdaemons-dir "$MNT/System/Library/LaunchDaemons" \
            --extensions-dir "$MNT/System/Library/Extensions" \
            --cdhash-out "$SEED_DIR/CDHashes-platform.txt"
          hdiutil detach "$MNT" || true
          sudo gzip -f -1 "$SEED_DIR/owner-data-2048-metal-probe.cdr"
          ls -la "$SEED_DIR"
          cat "$SEED_DIR/CDHashes-platform.txt"

      - name: Publish the seed and the log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          TAG="data-seed-2g-metal-${{ github.run_number }}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "2 GiB desktop Data seed with NativeAdrenoMetal.bundle, vktest, and mtltest" || true
          for f in "$RUNNER_TEMP/gpu-seed/"*.gz "$RUNNER_TEMP/gpu-seed/CDHashes-platform.txt"; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber || true
            fi
          done
          gh release upload "$TAG" /tmp/seed.log --repo "$GITHUB_REPOSITORY" --clobber || true
