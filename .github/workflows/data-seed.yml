name: houji initial Data volume

on:
  workflow_dispatch:
  push:
    branches: [kernel-cs-bypass]
    paths: [".github/workflows/data-seed.yml"]

permissions:
  contents: write

jobs:
  data:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: fb2bb310564ce66779e472a021881cf7c5764919
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute OS cache key
        id: os-key
        run: python3 scripts/firmware-cache.py key --group os
      - name: Restore verified OS firmware cache
        id: os-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/system-source/ipsw
          key: ${{ steps.os-key.outputs.key }}
      - name: Fetch and verify original OS
        run: python3 -u scripts/fetch-system.py --unixnu "$GITHUB_WORKSPACE/upstream" --out "$RUNNER_TEMP/system-source" --components OS
      - name: Save verified OS before creating Data seed
        if: steps.os-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/system-source/ipsw
          key: ${{ steps.os-key.outputs.key }}
      - name: Create Data seed from the original var tree
        run: |
          set -e
          sed -i.bak "s/raise SystemExit(.Require the unchanged supplied original OS mount.)/pass/" upstream/scripts/prepare-owner-data-fixture.py || true
          DMG=$(ls "$RUNNER_TEMP"/system-source/ipsw/20H392/*.dmg 2>/dev/null | head -1)
          [ -n "$DMG" ] || DMG=$(find "$RUNNER_TEMP"/system-source/ipsw -name "*.dmg" | head -1)
          echo "OS dmg: $DMG"
          python3 scripts/create-data-seed.py --unixnu "$GITHUB_WORKSPACE/upstream" --dmg "$DMG" --output "$RUNNER_TEMP/data-seed"
          ls -la "$RUNNER_TEMP/data-seed"
          shasum -a 256 "$RUNNER_TEMP/data-seed/owner-data-32.cdr"
      - name: Seed skip-setup state into the Data seed
        run: |
          set -e
          python3 scripts/seed-skip-setup.py \
            "$RUNNER_TEMP/data-seed/owner-data-32.cdr" \
            "$RUNNER_TEMP/data-seed/owner-data-32-skip.cdr"
          gzip -f -1 "$RUNNER_TEMP/data-seed/owner-data-32-skip.cdr"
          shasum -a 256 "$RUNNER_TEMP/data-seed/owner-data-32-skip.cdr.gz"

      - name: Build HFS+ Data image
        run: |
          set -e
          rm -f /tmp/hfs.cdr
          hdiutil create -size 64m -layout NONE -fs "HFSX" -volname houjiData -type UDTO /tmp/hfs.cdr || { dd if=/dev/zero of=/tmp/hfs.cdr bs=1m count=64; newfs_hfs -s -v houjiData /tmp/hfs.cdr; }
          rm -rf /tmp/hfsmnt; mkdir -p /tmp/hfsmnt
          hdiutil attach -nobrowse -owners off -mountpoint /tmp/hfsmnt /tmp/hfs.cdr > /dev/null
          mkdir -p /tmp/hfsmnt/keybags /tmp/hfsmnt/mobile/tmp /tmp/hfsmnt/tmp /tmp/hfsmnt/run /tmp/hfsmnt/db /tmp/hfsmnt/preferences /tmp/hfsmnt/lib
          chmod 1777 /tmp/hfsmnt/tmp
          hdiutil detach /tmp/hfsmnt || true
          python3 -c "d=open('/tmp/hfs.cdr','rb').read(); print('hfs image', len(d), 'bytes, sig', d[1024:1026].hex())"
          gzip -f /tmp/hfs.cdr
          cp /tmp/hfs.cdr.gz "$RUNNER_TEMP/hfs.cdr.gz"
          shasum -a 256 "$RUNNER_TEMP/hfs.cdr.gz"

      - name: Publish Data seed to ci-diagnostics
        run: |
          set -e
          gzip -f "$RUNNER_TEMP/data-seed/owner-data-32.cdr"
          git config --global user.email "unixnu@local"
          git config --global user.name "UniXNU"
          git clone -q --depth 1 -b ci-diagnostics "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/cidiag
          mkdir -p /tmp/cidiag/data-seed
          cp "$RUNNER_TEMP/data-seed/owner-data-32.cdr.gz" /tmp/cidiag/data-seed/houji-owner-data-32.cdr.gz
          cp "$RUNNER_TEMP/data-seed/owner-data-32-skip.cdr.gz" /tmp/cidiag/data-seed/houji-owner-data-skip.cdr.gz 2>/dev/null || true
          cp "$RUNNER_TEMP/hfs.cdr.gz" /tmp/cidiag/data-seed/houji-hfs.cdr.gz 2>/dev/null || true
          cp "$RUNNER_TEMP/data-seed/seed.json" /tmp/cidiag/data-seed/seed.json 2>/dev/null || true
          cd /tmp/cidiag
          git add -f data-seed
          git commit -q -m "initial Data seed (${{ github.run_number }})" || echo "no change"
          git push -f origin ci-diagnostics || echo "push failed"
      - uses: actions/upload-artifact@v4
        with:
          name: houji-initial-data-seed
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/data-seed/owner-data-32.cdr.gz
            ${{ runner.temp }}/data-seed/seed.json
          retention-days: 14