name: houji merged root

on:
  workflow_dispatch:
  push:
    branches: [kernel-cs-bypass]
    paths:
      - ".github/workflows/merged-root.yml"
      - "scripts/merged-root-*.py"

permissions:
  contents: write

jobs:
  merge:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: fb2bb310564ce66779e472a021881cf7c5764919
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch OS and SystemOS components
        run: |
          set -e
          python3 -u scripts/fetch-system.py --unixnu "$GITHUB_WORKSPACE/upstream" \
            --out "$RUNNER_TEMP/system-source" --components OS "Cryptex1,SystemOS"
          python3 scripts/merged-root-prep.py "$RUNNER_TEMP/system-source" "$RUNNER_TEMP/dmgs.txt"

      - name: Merge into a writable root volume
        run: |
          set -eux
          OS_DMG=$(sed -n 1p "$RUNNER_TEMP/dmgs.txt")
          SYS_DMG=$(sed -n 2p "$RUNNER_TEMP/dmgs.txt")
          hdiutil attach -readonly -nobrowse "$OS_DMG" | tee /tmp/att_os.txt
          OSMNT=$(awk 'NF>=3 {print $NF}' /tmp/att_os.txt | tail -1)
          hdiutil attach -readonly -nobrowse "$SYS_DMG" | tee /tmp/att_sys.txt
          SYSMNT=$(awk 'NF>=3 {print $NF}' /tmp/att_sys.txt | tail -1)
          echo "OS at $OSMNT"; ls "$OSMNT" | head
          echo "SystemOS at $SYSMNT"; ls "$SYSMNT" | head
          rm -f /tmp/root.dmg
          hdiutil create -size 12g -layout NONE -volname houjiRoot -fs HFSX -type UDRW /tmp/root.dmg
          hdiutil attach -nobrowse /tmp/root.dmg | tee /tmp/att_root.txt
          ROOTMNT=$(awk 'NF>=3 {print $NF}' /tmp/att_root.txt | tail -1)
          echo "merged at $ROOTMNT"; df -h "$ROOTMNT"
          ditto "$OSMNT/" "$ROOTMNT/"
          ditto "$SYSMNT/" "$ROOTMNT/"
          if [ -f "$OSMNT/usr/lib/dyld" ]; then cp -p "$OSMNT/usr/lib/dyld" "$ROOTMNT/usr/lib/dyld"; fi
          sync
          hdiutil detach "$ROOTMNT"
          hdiutil detach "$OSMNT" || true
          hdiutil detach "$SYSMNT" || true
          python3 scripts/merged-root-extract.py /tmp/root.dmg "$RUNNER_TEMP/merged-root.raw"
          gzip -1 -f "$RUNNER_TEMP/merged-root.raw"
          shasum -a 256 "$RUNNER_TEMP/merged-root.raw.gz"

      - name: Publish merged root to ci-diagnostics
        if: success()
        run: |
          set -e
          git config --global user.email "unixnu@local"
          git config --global user.name "UniXNU"
          git clone -q --depth 1 -b ci-diagnostics \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/cidiag
          mkdir -p /tmp/cidiag/merged-root
          cp "$RUNNER_TEMP/merged-root.raw.gz" /tmp/cidiag/merged-root/houji-merged-root.raw.gz
          python3 scripts/merged-root-report.py "$RUNNER_TEMP/merged-root.raw.gz" \
            /tmp/cidiag/merged-root/report.json "${{ github.run_number }}"
          cd /tmp/cidiag
          git add -f merged-root
          git commit -q -m "merged root ${{ github.run_number }}" || echo "no change"
          git push -f origin ci-diagnostics || echo "push failed"

      - name: Publish merge logs
        if: always()
        run: |
          git config --global user.email "unixnu@local"
          git config --global user.name "UniXNU"
          git clone -q --depth 1 -b ci-diagnostics \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/cidiag2 || exit 0
          mkdir -p /tmp/cidiag2/merged-root
          cp /tmp/att_os.txt /tmp/att_sys.txt /tmp/att_root.txt /tmp/cidiag2/merged-root/ 2>/dev/null || true
          cd /tmp/cidiag2
          git add -f merged-root
          git commit -q -m "merged root logs ${{ github.run_number }}" || exit 0
          git push -f origin ci-diagnostics || exit 0
