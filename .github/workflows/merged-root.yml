name: houji merged root

on:
  workflow_dispatch:
  push:
    branches: [kernel-cs-bypass, merged-root-ci]
    paths:
      - ".github/workflows/merged-root.yml"
      - "scripts/merged-root-*.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe release write capability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          TAG="ci-probe-${{ github.run_number }}"
          echo "probe $(date -u)" > probe.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "transport probe" --notes "release write probe" probe.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          echo RELEASE_PROBE_OK

  merge:
    needs: probe
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: fb2bb310564ce66779e472a021881cf7c5764919
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch OS and SystemOS components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          SRC="$RUNNER_TEMP/system-source"
          FW_TAG=fw-cache-20H392
          mkdir -p "$SRC/ipsw/20H392"
          if gh release view "$FW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "firmware from release $FW_TAG"
            STAGE="$RUNNER_TEMP/fwstage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
            gh release download "$FW_TAG" --repo "$GITHUB_REPOSITORY" --dir "$STAGE"
            python3 scripts/merged-root-fwcache.py unpack "$STAGE" "$SRC"
            rm -rf "$STAGE"
          else
            echo "firmware from Apple (cached for later runs after this step)"
            python3 -u scripts/fetch-system.py --unixnu "$GITHUB_WORKSPACE/upstream" \
              --out "$SRC" --components OS "Cryptex1,SystemOS"
            STAGE="$RUNNER_TEMP/fwstage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
            python3 scripts/merged-root-fwcache.py pack "$SRC" "$STAGE"
            gh release create "$FW_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "iOS 20H392 OS + SystemOS firmware" \
              --notes "chunked firmware cache for the merged-root workflow" || true
            gh release upload "$FW_TAG" "$STAGE"/* --repo "$GITHUB_REPOSITORY" --clobber || true
            rm -rf "$STAGE"
          fi
          python3 scripts/merged-root-prep.py "$SRC" "$RUNNER_TEMP/dmgs.txt"

      - name: Merge into a writable root volume
        run: |
          set -eux
          exec > >(tee /tmp/merge_step.log) 2>&1
          date
          df -h / "$RUNNER_TEMP" || true
          OS_DMG=$(sed -n 1p "$RUNNER_TEMP/dmgs.txt")
          SYS_DMG=$(sed -n 2p "$RUNNER_TEMP/dmgs.txt")
          hdiutil attach -readonly -nobrowse "$OS_DMG" | tee /tmp/att_os.txt
          OSMNT=$(awk 'NF>=3 {print $NF}' /tmp/att_os.txt | tail -1)
          hdiutil attach -readonly -nobrowse "$SYS_DMG" | tee /tmp/att_sys.txt
          SYSMNT=$(awk 'NF>=3 {print $NF}' /tmp/att_sys.txt | tail -1)
          echo "OS at $OSMNT"; ls "$OSMNT" | head
          echo "SystemOS at $SYSMNT"; ls "$SYSMNT" | head
          rm -f /tmp/root.dmg /tmp/root.sparseimage
          hdiutil create -size 9.5g -volname houjiRoot -fs APFS -type SPARSE /tmp/root.sparseimage
          hdiutil attach -owners on -nobrowse /tmp/root.sparseimage | tee /tmp/att_root.txt
          ROOTMNT=$(awk 'NF>=3 {print $NF}' /tmp/att_root.txt | tail -1)
          echo "merged at $ROOTMNT"; df -h "$ROOTMNT"
          if ! sudo ditto "$OSMNT/" "$ROOTMNT/"; then
            echo "ditto failed, falling back to rsync"
            sudo rsync -aH --numeric-ids --exclude '.file' "$OSMNT/" "$ROOTMNT/"
          fi
          for sub in usr/lib usr/libexec usr/bin usr/sbin usr/share System/Library/CoreServices System/Library/Caches/com.apple.dyld; do
            if [ -d "$SYSMNT/$sub" ]; then
              mkdir -p "$ROOTMNT/$sub"
              sudo rsync -aH --numeric-ids "$SYSMNT/$sub/" "$ROOTMNT/$sub/"
            fi
          done
          if [ -f "$OSMNT/usr/lib/dyld" ]; then sudo cp -p "$OSMNT/usr/lib/dyld" "$ROOTMNT/usr/lib/dyld"; fi
          # launchd rejects plists whose uid/gid is not 0:0 or that are group/other writable.
          sudo chown -R 0:0 "$ROOTMNT"
          sudo chmod -R go-w "$ROOTMNT"
          stat -f "HOUJI-OWN-CHECK %u:%g %m %N" "$ROOTMNT/System/Library/LaunchDaemons/com.apple.SpringBoard.plist" || true
          stat -f "HOUJI-OWN-CHECK %u:%g %m %N" "$ROOTMNT/usr/lib/libobjc-trampolines.dylib" || true
          sync
          du -sh "$ROOTMNT" || true
          df -h "$ROOTMNT"
          CANDS=$(awk 'NF>=2 {print $1}' /tmp/att_root.txt | grep '^/dev/disk' | paste -sd, -)
          echo "candidates=$CANDS"
          rm -f "$RUNNER_TEMP"/part-*
          sudo /usr/bin/python3 scripts/merged-root-extract.py --devices "$CANDS" "$RUNNER_TEMP" 1900 \
            "$RUNNER_TEMP/merged-root.report.json" "${{ github.run_number }}"
          hdiutil detach -force "$ROOTMNT" || true
          hdiutil detach "$OSMNT" || true
          hdiutil detach "$SYSMNT" || true
          rm -f /tmp/root.sparseimage
          ls -la "$RUNNER_TEMP"/part-*
          df -h "$RUNNER_TEMP" || true

      - name: Publish raw parts to a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="merged-root-${{ github.run_number }}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "merged root ${{ github.run_number }}" \
            --notes "merged root raw volume, split into <2 GiB parts" || true
          gh release upload "$TAG" "$RUNNER_TEMP"/part-* "$RUNNER_TEMP/merged-root.report.json" /tmp/merge_step.log \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish merge logs
        if: always()
        run: |
          set -x
          git config --global user.email "unixnu@local"
          git config --global user.name "UniXNU"
          AUTH="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/cimerged
          git clone -q --depth 1 "$AUTH" /tmp/cimerged || exit 0
          cd /tmp/cimerged
          git checkout -q --orphan ci-merged || exit 0
          git rm -rfq . 2>/dev/null || true
          mkdir -p merged-root
          cp /tmp/att_os.txt /tmp/att_sys.txt /tmp/att_root.txt /tmp/merge_step.log merged-root/ 2>/dev/null || true
          cp "$RUNNER_TEMP/merged-root.report.json" merged-root/report.json 2>/dev/null || true
          git add -f merged-root
          git commit -q -m "merged root logs ${{ github.run_number }}" || true
          git push -f origin ci-merged || true
          cd /
          rm -rf /tmp/cidiag2
          git clone -q --depth 1 -b ci-diagnostics "$AUTH" /tmp/cidiag2 || exit 0
          mkdir -p /tmp/cidiag2/merged-root
          cp /tmp/att_os.txt /tmp/att_sys.txt /tmp/att_root.txt /tmp/merge_step.log /tmp/cidiag2/merged-root/ 2>/dev/null || true
          cd /tmp/cidiag2
          git add -f merged-root
          git commit -q -m "merged root logs ${{ github.run_number }}" || exit 0
          git push -f origin ci-diagnostics || exit 0
