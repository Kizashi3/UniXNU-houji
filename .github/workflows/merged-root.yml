name: houji merged root

on:
  workflow_dispatch:
  push:
    branches: [kernel-cs-bypass]
    paths:
      - ".github/workflows/merged-root.yml"
      - "scripts/merged-root-*.py"

permissions:
  contents: write

jobs:
  merge:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: fb2bb310564ce66779e472a021881cf7c5764919
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch OS and SystemOS components
        run: |
          set -e
          python3 -u scripts/fetch-system.py --unixnu "$GITHUB_WORKSPACE/upstream" \
            --out "$RUNNER_TEMP/system-source" --components OS "Cryptex1,SystemOS"
          python3 scripts/merged-root-prep.py "$RUNNER_TEMP/system-source" "$RUNNER_TEMP/dmgs.txt"

      - name: Merge into a writable root volume
        run: |
          set -eux
          exec > >(tee /tmp/merge_step.log) 2>&1
          OS_DMG=$(sed -n 1p "$RUNNER_TEMP/dmgs.txt")
          SYS_DMG=$(sed -n 2p "$RUNNER_TEMP/dmgs.txt")
          hdiutil attach -readonly -nobrowse "$OS_DMG" | tee /tmp/att_os.txt
          OSMNT=$(awk 'NF>=3 {print $NF}' /tmp/att_os.txt | tail -1)
          hdiutil attach -readonly -nobrowse "$SYS_DMG" | tee /tmp/att_sys.txt
          SYSMNT=$(awk 'NF>=3 {print $NF}' /tmp/att_sys.txt | tail -1)
          echo "OS at $OSMNT"; ls "$OSMNT" | head
          echo "SystemOS at $SYSMNT"; ls "$SYSMNT" | head
          rm -f /tmp/root.dmg
          hdiutil create -size 10g -volname houjiRoot -fs APFS -type SPARSE /tmp/root.sparseimage
          hdiutil attach -nobrowse /tmp/root.sparseimage | tee /tmp/att_root.txt
          ROOTMNT=$(awk 'NF>=3 {print $NF}' /tmp/att_root.txt | tail -1)
          echo "merged at $ROOTMNT"; df -h "$ROOTMNT"
          if ! sudo ditto "$OSMNT/" "$ROOTMNT/"; then
            echo "ditto failed, falling back to rsync"
            sudo rsync -aH --numeric-ids --exclude '.file' "$OSMNT/" "$ROOTMNT/"
          fi
          # Merge the whole SystemOS volume: services on this platform fail when
          # their frameworks or daemons are missing from the merged root.
          sudo rsync -aH --numeric-ids "$SYSMNT/" "$ROOTMNT/" || true
          df -h "$ROOTMNT"
          if [ -f "$OSMNT/usr/lib/dyld" ]; then sudo cp -p "$OSMNT/usr/lib/dyld" "$ROOTMNT/usr/lib/dyld"; fi
          echo "service inventory"
          for rel in sbin/launchd usr/lib/dyld \
              System/Library/CoreServices/SpringBoard.app/SpringBoard \
              System/Library/Frameworks/UIKit.framework/UIKit \
              System/Library/PrivateFrameworks/FrontBoard.framework/FrontBoard \
              System/Library/PrivateFrameworks/BackBoardServices.framework/BackBoardServices \
              System/Library/PrivateFrameworks/RunningBoardServices.framework/RunningBoardServices \
              System/Library/LaunchDaemons/com.apple.backboardd.plist \
              System/Library/LaunchDaemons/com.apple.SpringBoard.plist; do
            if sudo test -e "$ROOTMNT/$rel"; then echo "ok $rel"; else echo "MISSING $rel"; fi
          done
          sudo test -x "$ROOTMNT/System/Library/CoreServices/SpringBoard.app/SpringBoard"
          sudo test -f "$ROOTMNT/usr/lib/dyld"
          echo "launch daemons: $(sudo ls "$ROOTMNT/System/Library/LaunchDaemons" | wc -l)"
          echo "launch agents: $(sudo ls "$ROOTMNT/System/Library/LaunchAgents" | wc -l)"
          echo "private frameworks: $(sudo ls "$ROOTMNT/System/Library/PrivateFrameworks" | wc -l)"
          df -h / "$RUNNER_TEMP"
          sync
          hdiutil detach "$ROOTMNT"
          hdiutil detach "$OSMNT" || true
          hdiutil detach "$SYSMNT" || true
          # Read the APFS partition straight off the attached image: converting the
          # sparse image first wrote two extra 10 GiB copies that this runner cannot hold.
          hdiutil attach -readonly -nobrowse /tmp/root.sparseimage | tee /tmp/att_root2.txt
          APFS_DEV=$(grep Apple_APFS /tmp/att_root2.txt | awk '{print $1}' | head -1)
          echo "apfs partition $APFS_DEV"
          test -n "$APFS_DEV"
          sudo dd if="$(echo "$APFS_DEV" | sed 's#/dev/disk#/dev/rdisk#')" \
            of="$RUNNER_TEMP/merged-root.raw" bs=8m status=progress
          hdiutil detach "$(echo "$APFS_DEV" | sed 's/s[0-9]*$//')" || true
          rm -f /tmp/root.sparseimage
          python3 - "$RUNNER_TEMP/merged-root.raw" <<'PY'
          import pathlib
          import struct
          import sys
          p = pathlib.Path(sys.argv[1])
          with p.open("rb") as f:
              head = f.read(64)
          assert head[32:36] == b"NXSB", head[:64]
          block, count = struct.unpack_from("<IQ", head, 36)
          total = block * count
          print("container", total, "file", p.stat().st_size)
          assert total <= p.stat().st_size
          if total < p.stat().st_size:
              with p.open("r+b") as f:
                  f.truncate(total)
          PY
          df -h / "$RUNNER_TEMP"
          sync
          shasum -a 256 "$RUNNER_TEMP/merged-root.raw"
          rm -f "$RUNNER_TEMP"/part-*
          split -b 1900m -d "$RUNNER_TEMP/merged-root.raw" "$RUNNER_TEMP/part-"
          ls -la "$RUNNER_TEMP"/part-*

      - name: Publish raw parts to a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="merged-root-${{ github.run_number }}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "merged root ${{ github.run_number }}" \
            --notes "merged root raw volume, split into <2 GiB parts" || true
          gh release upload "$TAG" "$RUNNER_TEMP"/part-* --repo "$GITHUB_REPOSITORY" --clobber
          python3 scripts/merged-root-report.py "$RUNNER_TEMP/merged-root.raw" \
            "$RUNNER_TEMP/merged-root.report.json" "$TAG"
          git config --global user.email "unixnu@local"
          git config --global user.name "UniXNU"
          git clone -q --depth 1 -b ci-diagnostics \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/cidiag || exit 0
          mkdir -p /tmp/cidiag/merged-root
          cp "$RUNNER_TEMP/merged-root.report.json" /tmp/cidiag/merged-root/report.json
          cd /tmp/cidiag
          git add -f merged-root
          git commit -q -m "merged root report ${{ github.run_number }}" || exit 0
          git push -f origin ci-diagnostics || exit 0

      - name: Publish merge logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          TAG="merge-log-${{ github.run_number }}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "merged root merge log" || true
          for f in /tmp/att_os.txt /tmp/att_sys.txt /tmp/att_root.txt /tmp/att_root2.txt /tmp/merge_step.log; do
            if [ -f "$f" ]; then gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber || true; fi
          done
