name: houji big Data seed

on:
  workflow_dispatch:
  push:
    branches: [merged-root-kernel]
    paths:
      - ".github/workflows/data-seed-big.yml"
      - "scripts/make-data-seed.py"

permissions:
  contents: write

jobs:
  seed:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: fb2bb310564ce66779e472a021881cf7c5764919
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch OS from the firmware cache release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          SRC="$RUNNER_TEMP/system-source"
          mkdir -p "$SRC/ipsw/20H392"
          STAGE="$RUNNER_TEMP/fwstage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          gh release download fw-cache-20H392 --repo "$GITHUB_REPOSITORY" --dir "$STAGE"
          python3 scripts/merged-root-fwcache.py unpack "$STAGE" "$SRC"
          rm -rf "$STAGE"
          python3 scripts/merged-root-prep.py "$SRC" "$RUNNER_TEMP/dmgs.txt"
          sed -n 1p "$RUNNER_TEMP/dmgs.txt"

      - name: Mount the OS and build the 512 MiB seed
        run: |
          set -eux
          DMG=$(sed -n 1p "$RUNNER_TEMP/dmgs.txt")
          MNT="$GITHUB_WORKSPACE/upstream/.cache/firmware/target-volumes/os-mount"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"
          cd "$GITHUB_WORKSPACE/upstream"
          sudo python3 "$GITHUB_WORKSPACE/scripts/make-data-seed.py" --output "$RUNNER_TEMP/data-seed"
          hdiutil detach "$MNT" || true
          ls -la "$RUNNER_TEMP/data-seed"

      - name: Seed skip-setup state
        run: |
          set -eux
          sudo python3 scripts/seed-skip-setup.py \
            "$RUNNER_TEMP/data-seed/owner-data-512.cdr" \
            "$RUNNER_TEMP/data-seed/owner-data-512-skip.cdr"
          gzip -f -1 "$RUNNER_TEMP/data-seed/owner-data-512-skip.cdr"
          ls -la "$RUNNER_TEMP/data-seed"

      - name: Publish the seed to ci-data-seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          git config --global user.email "unixnu@local"
          git config --global user.name "UniXNU"
          AUTH="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/seedbranch
          git clone -q --depth 1 "$AUTH" /tmp/seedbranch
          cd /tmp/seedbranch
          git checkout -q --orphan ci-data-seed
          git rm -rfq . 2>/dev/null || true
          mkdir -p data-seed
          cp "$RUNNER_TEMP/data-seed/"*.gz data-seed/
          cp "$RUNNER_TEMP/data-seed/seed.json" data-seed/ 2>/dev/null || true
          git add -f data-seed
          git commit -q -m "big data seed ${{ github.run_number }}"
          git push -f origin ci-data-seed
