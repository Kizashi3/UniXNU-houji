name: houji A750 GPU kernel

# Build the pinned Darwin 22 kernel from lonzzi/UniXNU-houji without mixing
# blacktop's generic Ventura patch series into Houji's own patch. blacktop is
# used only for the KDK, MIG/CTF tools and fakeroot dependency build.
on:
  workflow_dispatch:
  push:
    branches: [codex/gpu-a750-r5]
    paths:
      - .github/workflows/houji-gpu-a750-kernel.yml

permissions:
  contents: write

concurrency:
  group: houji-a750-kernel-r5-${{ github.ref }}
  cancel-in-progress: false

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  PORT_REPO: https://github.com/Kizashi3/UniXNU-houji
  # Probe-only A750 source: APFS OS-window read, portable log window, no
  # block-device registration or HFSX root dependency in this trial.
  PORT_SHA: 54c51d0a0513f51bf5687254202fa933f5ee6776
  XNU_REPO: https://github.com/apple-oss-distributions/xnu
  # This is the peeled xnu-8796.141.3 commit, the exact revision pinned by
  # lonzzi/UniXNU-houji. Adreno740 is the historical source directory name;
  # the hardware and firmware generation here are Adreno 750 / gen70900.
  XNU_SHA: 1b191cb58250d0705d8a51287127505aa4bc0789
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET
  QCOM_PKG_URL: https://geo.mirror.pkgbuild.com/core/os/x86_64/linux-firmware-qcom-20261019-1-any.pkg.tar.zst

jobs:
  kernel:
    # macos-15 and macos-26 jobs sat unclaimed for GitHub's 15-minute
    # acquisition limit; r1 did acquire a macos-14 runner. That image also
    # carries Xcode 15, which matches the xnu-8796/KDK 13.5 input set.
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - name: Check out device repository
        uses: actions/checkout@v4

      - name: Check out pinned Houji GPU sources
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PORT_REPO }}
          ref: ${{ env.PORT_SHA }}
          path: port
          persist-credentials: false

      - name: Check out XNU build helper
        run: |
          set -euo pipefail
          git init -q dxb
          git -C dxb remote add origin "$DXB_REPO"
          git -C dxb fetch -q --depth 1 origin "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD

      - name: Check out the exact XNU revision
        run: |
          set -euo pipefail
          git init -q dxb/xnu
          git -C dxb/xnu remote add origin "$XNU_REPO"
          git -C dxb/xnu fetch -q --depth 1 origin "$XNU_SHA"
          git -C dxb/xnu checkout -q FETCH_HEAD
          test "$(git -C dxb/xnu rev-parse HEAD)" = "$XNU_SHA"
          git -C dxb/xnu describe --tags --exact-match

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools
        run: |
          set -euo pipefail
          brew install jq gum bash cmake ninja zstd
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          if compgen -G '/Applications/Xcode_15*.app' >/dev/null; then
            XC=$(ls -d /Applications/Xcode_15*.app | sort -V | tail -1)
            echo "using Xcode 15.x"
          else
            XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "warning: Xcode 15.x is absent; using the newest runner Xcode"
          fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Apply the original Houji patch and A750 overlay
        run: |
          set -euo pipefail
          git -C dxb/xnu apply --check "$GITHUB_WORKSPACE/port/kernel/patches/local.patch"
          git -C dxb/xnu apply "$GITHUB_WORKSPACE/port/kernel/patches/local.patch"
          ditto "$GITHUB_WORKSPACE/port/kernel/overlay/" "$GITHUB_WORKSPACE/dxb/xnu/"
          grep -q 'houji-ufs-root/Adreno740/NativeAdrenoPublish.cpp' dxb/xnu/iokit/conf/files
          test -f dxb/xnu/config/MASTER.arm64.sweet
          test -f dxb/xnu/iokit/Kernel/houji-ufs-root/Adreno740/NativeAdrenoPublish.cpp
          python3 port/tools/check-trial-bindings.py dxb/xnu

      - name: Prepare A750 firmware headers
        run: |
          set -euo pipefail
          mkdir -p fw
          curl -L --retry 4 --connect-timeout 30 -o fw/qcom.pkg.tar.zst "$QCOM_PKG_URL"
          tar -xf fw/qcom.pkg.tar.zst -C fw \
            usr/lib/firmware/qcom/gmu_gen70900.bin.zst \
            usr/lib/firmware/qcom/gen70900_sqe.fw.zst \
            usr/lib/firmware/qcom/gen70900_aqe.fw.zst
          zstd -d -f fw/usr/lib/firmware/qcom/gmu_gen70900.bin.zst -o fw/gmu_gen70900.bin
          zstd -d -f fw/usr/lib/firmware/qcom/gen70900_sqe.fw.zst -o fw/gen70900_sqe.fw
          zstd -d -f fw/usr/lib/firmware/qcom/gen70900_aqe.fw.zst -o fw/gen70900_aqe.fw
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          pins = Path("port/kernel/firmware-inputs.json")
          data = json.loads(pins.read_text())
          for symbol, name in (
              ("gHoujiGmuFirmwareImage", "gmu_gen70900.bin"),
              ("gHoujiSqeFirmwareImage", "gen70900_sqe.fw"),
              ("gHoujiAqeFirmwareImage", "gen70900_aqe.fw"),
          ):
              payload = (Path("fw") / name).read_bytes()
              data[symbol]["bytes"] = len(payload)
              data[symbol]["sha256"] = hashlib.sha256(payload).hexdigest()
              print(symbol, len(payload), data[symbol]["sha256"])
          pins.write_text(json.dumps(data, indent=2) + "\n")
          PY
          python3 port/tools/make-firmware-headers.py \
            --gmu fw/gmu_gen70900.bin \
            --sqe fw/gen70900_sqe.fw \
            --aqe fw/gen70900_aqe.fw \
            --output dxb/xnu/iokit/Kernel/houji-ufs-root
          grep -q 'gen70900' dxb/xnu/iokit/Kernel/houji-ufs-root/HoujiGmuFirmwareImage.h

      - name: Build MIG, CTF and fakeroot dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dxb/build.sh")
          text = path.read_text()
          needle = "    patches\n    venv\n"
          assert text.count(needle) == 1
          text = text.replace(
              needle,
              "    info \"Skipping blacktop generic XNU patches; Houji patch is already applied\"\n    venv\n",
              1,
          )
          needle = "        build_xnu\n"
          assert text.count(needle) == 1
          text = text.replace(
              needle,
              "        info \"Kernel compile delegated to lonzzi Houji build-kernel.sh\"\n",
              1,
          )
          path.write_text(text)
          PY
          grep -n -A5 -B3 'Skipping blacktop generic' dxb/build.sh
          bash dxb/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/a750-kernel-deps.log"

      - name: Compile the pinned A750 kernel
        env:
          HOUJI_XNU: ${{ github.workspace }}/dxb/xnu
          HOUJI_KDK: /Library/Developer/KDKs/KDK_13.5_22G74.kdk/Payload
          HOUJI_FAKEROOT: ${{ github.workspace }}/dxb/fakeroot
          HOUJI_BUILD_ROOT: ${{ github.workspace }}/dxb/build/houji-kernel
          HOUJI_JOBS: "8"
        run: |
          set -euo pipefail
          test -d "$HOUJI_KDK/System/Library/KernelSupport"
          test -x "$HOUJI_FAKEROOT/usr/local/bin/ctfconvert"
          test -x port/tools/iig-darwin22.py
          bash port/tools/build-kernel.sh 2>&1 | tee "$GITHUB_WORKSPACE/a750-kernel-build.log"

      - name: Collect kernel and reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          cp -a dxb/build/houji-kernel/xnu.obj/kernel.development.sweet out/ 2>/dev/null || true
          cp -a dxb/build/houji-kernel/fakeroot/System/Library/Kernels/kernel.development.sweet out/ 2>/dev/null || true
          cp -a a750-kernel-build.log a750-kernel-deps.log out/ 2>/dev/null || true
          if test -f out/kernel.development.sweet; then
            file out/kernel.development.sweet
            lipo -info out/kernel.development.sweet || true
            shasum -a 256 out/kernel.development.sweet | tee out/kernel.development.sweet.sha256
            strings out/kernel.development.sweet | grep -E 'HoujiAdreno750|Adreno750|HoujiAdreno|NativeAdreno|gen70900|HOUJI' | sort -u | tail -80 > out/gpu-markers.txt || true
            grep -E 'HoujiAdreno750|Adreno750|NativeAdreno' out/gpu-markers.txt > out/a750-markers.txt
            test -s out/a750-markers.txt
          fi
          ls -lah out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: houji-a750-kernel-r${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish easy-to-fetch kernel release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="a750-kernel-r${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --title "$tag" --notes "A750 gen70900 GPU Darwin 22 kernel build for $GITHUB_SHA"
          for f in out/*; do
            gh release upload "$tag" "$f" --clobber || true
          done
