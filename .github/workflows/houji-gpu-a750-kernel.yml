name: houji A750 GPU kernel

# Build the pinned Darwin 22 kernel from lonzzi/UniXNU-houji without mixing
# blacktop's generic Ventura patch series into Houji's own patch. blacktop is
# used only for the KDK, MIG/CTF tools and fakeroot dependency build.
on:
  workflow_dispatch:
  push:
    branches: [codex/gpu-a750-r5]
    paths:
      - .github/workflows/houji-gpu-a750-kernel.yml
      - patches/a750-probe-apfs.patch

permissions:
  contents: write

concurrency:
  group: houji-a750-kernel-r5-${{ github.ref }}
  cancel-in-progress: false

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  # actions/checkout takes an owner/repo slug here, not a clone URL.
  PORT_REPO: lonzzi/UniXNU-houji
  PORT_SHA: 99beb109d66d24d3a1780901cb8958ec3fb24b06
  XNU_REPO: https://github.com/apple-oss-distributions/xnu
  # This is the peeled xnu-8796.141.3 commit, the exact revision pinned by
  # lonzzi/UniXNU-houji. Adreno740 is the historical source directory name;
  # the hardware and firmware generation here are Adreno 750 / gen70900.
  XNU_SHA: 1b191cb58250d0705d8a51287127505aa4bc0789
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET
  KDK_URL: https://github.com/dortania/KdkSupportPkg/releases/download/22G74/Kernel_Debug_Kit_13.5_build_22G74.dmg
  KDK_SHA256: 29866842eef039812888daea4176ce493be153b0d6d1b88f90753d69ea51b7d4
  KDK_BUILD: KDK_13.5_22G74

jobs:
  kernel:
    # macos-14 is no longer acquired for this public repository; macos-15
    # timed out in acquisition. macos-26 has repeatedly completed the other
    # Houji kernel workflow, so use it with the explicitly installed KDK.
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Check out device repository
        uses: actions/checkout@v4

      - name: Check out pinned Houji GPU sources
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PORT_REPO }}
          ref: ${{ env.PORT_SHA }}
          path: port
          persist-credentials: false

      - name: Apply the APFS-safe A750 probe patch
        run: |
          set -euo pipefail
          git -C port apply --check "$GITHUB_WORKSPACE/patches/a750-probe-apfs.patch"
          git -C port apply "$GITHUB_WORKSPACE/patches/a750-probe-apfs.patch"
          grep -q houji_gpu_probe_only port/kernel/overlay/iokit/Kernel/houji-ufs-root/HoujiUfsRead.cpp

      - name: Check out XNU build helper
        run: |
          set -euo pipefail
          git init -q dxb
          git -C dxb remote add origin "$DXB_REPO"
          git -C dxb fetch -q --depth 1 origin "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD

      - name: Check out the exact XNU revision
        run: |
          set -euo pipefail
          git init -q dxb/xnu
          git -C dxb/xnu remote add origin "$XNU_REPO"
          git -C dxb/xnu fetch -q --depth 1 origin "$XNU_SHA"
          git -C dxb/xnu checkout -q FETCH_HEAD
          test "$(git -C dxb/xnu rev-parse HEAD)" = "$XNU_SHA"
          # A bare-SHA fetch has no tag objects, so git describe would fail even
          # though the pinned commit is exact. The SHA check above is the gate.
          git -C dxb/xnu show -s --format='%H %s' HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools
        run: |
          set -euo pipefail
          brew install jq gum bash cmake ninja zstd
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          if compgen -G '/Applications/Xcode_15*.app' >/dev/null; then
            XC=$(ls -d /Applications/Xcode_15*.app | sort -V | tail -1)
            echo "using Xcode 15.x"
          else
            XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "warning: Xcode 15.x is absent; using the newest runner Xcode"
          fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install the matching Darwin 22 KDK
        run: |
          set -euxo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/kdk-install.log") 2>&1
          dmg="$RUNNER_TEMP/${KDK_BUILD}.dmg"
          mount="$RUNNER_TEMP/kdk-mount"
          mkdir -p "$mount"
          trap 'hdiutil detach "$mount" -force >/dev/null 2>&1 || true' EXIT
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 -o "$dmg" "$KDK_URL"
          ls -lh "$dmg"
          actual=$(shasum -a 256 "$dmg" | awk '{print $1}')
          echo "KDK sha256 actual=$actual expected=$KDK_SHA256"
          test "$actual" = "$KDK_SHA256"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          find "$mount" -maxdepth 2 -print
          kdk_root=$(find "$mount" -maxdepth 3 -type d -name "${KDK_BUILD}.kdk" -print -quit)
          if [ -z "$kdk_root" ]; then
            pkg=$(find "$mount" -maxdepth 3 -name '*.pkg' -print -quit)
            test -n "$pkg"
            if ! sudo installer -pkg "$pkg" -target /; then
              echo "KDK installer refused; expanding the package payload"
              rm -rf "$RUNNER_TEMP/kdk-expanded"
              pkgutil --expand-full "$pkg" "$RUNNER_TEMP/kdk-expanded"
              kdk_root=$(find "$RUNNER_TEMP/kdk-expanded" -type d -name "${KDK_BUILD}.kdk" -print -quit)
            else
              kdk_root="/Library/Developer/KDKs/${KDK_BUILD}.kdk"
            fi
          fi
          if [ -z "$kdk_root" ]; then
            kdk_root=$(find /Library/Developer/KDKs -maxdepth 1 -type d -name "${KDK_BUILD}*.kdk" -print -quit)
          fi
          hdiutil detach "$mount" -force
          trap - EXIT
          test -n "$kdk_root"
          # Installed KDK bundles place KernelSupport directly under System;
          # expanded .pkg payloads keep one extra Payload directory.
          if [ -d "$kdk_root/System/Library/KernelSupport" ]; then
            kdk_payload="$kdk_root"
          elif [ -d "$kdk_root/Payload/System/Library/KernelSupport" ]; then
            kdk_payload="$kdk_root/Payload"
          else
            echo "KernelSupport missing under $kdk_root" >&2
            find "$kdk_root" -maxdepth 5 -type d -name KernelSupport -print >&2
            exit 1
          fi
          echo "HOUJI_KDK=$kdk_payload" >> "$GITHUB_ENV"
          echo "KDK ready: $kdk_payload"

      - name: Apply the original Houji patch and A750 overlay
        run: |
          set -euo pipefail
          git -C dxb/xnu apply --check "$GITHUB_WORKSPACE/port/kernel/patches/local.patch"
          git -C dxb/xnu apply "$GITHUB_WORKSPACE/port/kernel/patches/local.patch"
          ditto "$GITHUB_WORKSPACE/port/kernel/overlay/" "$GITHUB_WORKSPACE/dxb/xnu/"
          grep -q 'houji-ufs-root/Adreno740/NativeAdrenoPublish.cpp' dxb/xnu/iokit/conf/files
          test -f dxb/xnu/config/MASTER.arm64.sweet
          test -f dxb/xnu/iokit/Kernel/houji-ufs-root/Adreno740/NativeAdrenoPublish.cpp
          python3 port/tools/check-trial-bindings.py dxb/xnu

      - name: Prepare pinned A750 firmware headers
        run: |
          set -euo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/a750-firmware.log") 2>&1
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          pins = Path("port/kernel/firmware-inputs.json")
          data = json.loads(pins.read_text())
          for symbol, name in (
              ("gHoujiGmuFirmwareImage", "firmware/gen70900/gmu_gen70900.bin"),
              ("gHoujiSqeFirmwareImage", "firmware/gen70900/gen70900_sqe.fw"),
              ("gHoujiAqeFirmwareImage", "firmware/gen70900/gen70900_aqe.fw"),
          ):
              payload = Path(name).read_bytes()
              actual = hashlib.sha256(payload).hexdigest()
              expected = data[symbol]
              if len(payload) != expected["bytes"] or actual != expected["sha256"]:
                  raise SystemExit(f"firmware pin mismatch: {name}")
              print(symbol, len(payload), actual)
          PY
          python3 port/tools/make-firmware-headers.py \
            --gmu firmware/gen70900/gmu_gen70900.bin \
            --sqe firmware/gen70900/gen70900_sqe.fw \
            --aqe firmware/gen70900/gen70900_aqe.fw \
            --output dxb/xnu/iokit/Kernel/houji-ufs-root
          # Generated headers contain the pinned arrays, not their source filenames.
          grep -q 'gHoujiGmuFirmwareImage\[78588\]' dxb/xnu/iokit/Kernel/houji-ufs-root/HoujiGmuFirmwareImage.h
          grep -q 'gHoujiSqeFirmwareImage\[85300\]' dxb/xnu/iokit/Kernel/houji-ufs-root/HoujiCpFirmwareImages.h
          grep -q 'gHoujiAqeFirmwareImage\[33176\]' dxb/xnu/iokit/Kernel/houji-ufs-root/HoujiCpFirmwareImages.h

      - name: Verify the Darwin 22 build inputs
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version
          test -d "$HOUJI_KDK/System/Library/KernelSupport"
          test -d dxb/xnu
          test -f dxb/xnu/config/MASTER.arm64.sweet
          ls -lh firmware/gen70900

      - name: Build MIG, CTF and fakeroot dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dxb/build.sh")
          text = path.read_text()
          needle = "    patches\n    venv\n"
          assert text.count(needle) == 1
          text = text.replace(
              needle,
              "    info \"Skipping blacktop generic XNU patches; Houji patch is already applied\"\n    venv\n",
              1,
          )
          needle = "        build_xnu\n"
          assert text.count(needle) == 1
          text = text.replace(
              needle,
              "        info \"Kernel compile delegated to lonzzi Houji build-kernel.sh\"\n",
              1,
          )
          path.write_text(text)
          PY
          grep -n -A5 -B3 'Skipping blacktop generic' dxb/build.sh
          bash dxb/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/a750-kernel-deps.log"

      - name: Compile the pinned A750 kernel
        env:
          HOUJI_XNU: ${{ github.workspace }}/dxb/xnu
          HOUJI_FAKEROOT: ${{ github.workspace }}/dxb/fakeroot
          HOUJI_BUILD_ROOT: ${{ github.workspace }}/dxb/build/houji-kernel
          HOUJI_JOBS: "8"
        run: |
          set -euo pipefail
          test -d "$HOUJI_KDK/System/Library/KernelSupport"
          test -x "$HOUJI_FAKEROOT/usr/local/bin/ctfconvert"
          test -x port/tools/iig-darwin22.py
          bash port/tools/build-kernel.sh 2>&1 | tee "$GITHUB_WORKSPACE/a750-kernel-build.log"

      - name: Collect kernel and reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "branch=$GITHUB_REF_NAME"
            echo "sha=$GITHUB_SHA"
            echo "port_repo=$PORT_REPO"
            echo "port_sha=$PORT_SHA"
            echo "kernel_present=$(test -f dxb/build/houji-kernel/xnu.obj/kernel.development.sweet && echo yes || echo no)"
          } > out/build-status.txt
          cp -a dxb/build/houji-kernel/xnu.obj/kernel.development.sweet out/ 2>/dev/null || true
          cp -a dxb/build/houji-kernel/fakeroot/System/Library/Kernels/kernel.development.sweet out/ 2>/dev/null || true
          cp -a a750-kernel-build.log a750-kernel-deps.log out/ 2>/dev/null || true
          cp -a a750-firmware.log out/ 2>/dev/null || true
          cp -a kdk-install.log out/ 2>/dev/null || true
          if test -f out/kernel.development.sweet; then
            file out/kernel.development.sweet
            lipo -info out/kernel.development.sweet || true
            shasum -a 256 out/kernel.development.sweet | tee out/kernel.development.sweet.sha256
            strings out/kernel.development.sweet | grep -E -i 'HoujiAdreno|Adreno ?750|NativeAdreno|gen70900|HOUJI GPU' | sort -u | tail -80 > out/gpu-markers.txt || true
            grep -E -i 'HoujiAdreno|Adreno ?750|NativeAdreno|gen70900|HOUJI GPU' out/gpu-markers.txt > out/a750-markers.txt
            test -s out/a750-markers.txt
          fi
          ls -lah out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: houji-a750-kernel-r${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish easy-to-fetch kernel release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="a750-kernel-r${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --title "$tag" --notes "A750 gen70900 GPU Darwin 22 kernel build for $GITHUB_SHA"
          for f in out/*; do
            gh release upload "$tag" "$f" --clobber || true
          done
